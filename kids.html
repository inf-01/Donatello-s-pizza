<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Zona Arcade Donatellos — Donatellos Delivery Dash 16-Bit Edition. Reparte pizza en moto, esquiva cajas y conos. Diversión retro para los peques.">
<meta name="theme-color" content="#0a0812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zona Arcade Donatellos | Delivery Dash</title>
<style>
  :root{
    --ink:#0b0e14;
    --panel:#120e28;
    --gold:#ffd23f;
    --red:#d63a2f;
    --cream:#f7e7c9;
    --cyan:#14c8ff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(255,210,63,.12), transparent 55%),
      radial-gradient(ellipse at 85% 95%, rgba(20,200,255,.12), transparent 55%),
      var(--ink);
    color:var(--cream);
    font-family:ui-monospace,'Cascadia Mono','Courier New',monospace;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  #top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    flex:0 0 auto;
  }
  #back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:50px;
    height:50px;
    border:3px solid var(--gold);
    border-radius:14px;
    background:var(--panel);
    color:var(--gold);
    font-size:22px;
    text-decoration:none;
    box-shadow:0 4px 0 #000;
  }
  #back-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #000; }
  #brand{
    font-size:14px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--gold);
    text-shadow:0 2px 0 #7a1d13;
    text-align:center;
  }
  #sound-btn{
    width:48px;
    height:48px;
    border:3px solid var(--gold);
    border-radius:14px;
    background:var(--panel);
    color:var(--gold);
    font-size:20px;
    box-shadow:0 4px 0 #000;
    cursor:pointer;
  }
  #sound-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #000; }
  #cabinet{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px calc(12px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    background-image:
      linear-gradient(45deg,var(--red) 25%,transparent 25%,transparent 75%,var(--red) 75%),
      linear-gradient(45deg,var(--red) 25%,#f3d9a8 25%,#f3d9a8 75%,var(--red) 75%);
    background-size:44px 44px;
    background-position:0 0,22px 22px;
    box-shadow:inset 0 0 70px rgba(0,0,0,.5);
  }
  #screen{
    position:relative;
    padding:14px;
    border-radius:20px;
    background:linear-gradient(#241d33,#0b0912);
    border:4px solid #000;
    box-shadow:0 0 0 3px #000, 0 12px 0 #000, 0 26px 50px rgba(0,0,0,.65), inset 0 0 26px #000;
  }
  #game{
    display:block;
    border-radius:10px;
    background:#0a0812;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
  }
  #crt{
    position:absolute;
    inset:14px;
    border-radius:10px;
    pointer-events:none;
    z-index:5;
    opacity:.96;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 4px),
      repeating-linear-gradient(to right, rgba(0,0,0,.05) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.5) 100%);
    box-shadow:inset 0 0 40px rgba(0,0,0,.55);
  }
  #crt::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:10px;
    background:linear-gradient(rgba(255,255,255,.03), rgba(255,255,255,0) 45%, rgba(0,0,0,.06) 55%);
  }
  #hud{
    position:absolute;
    left:24px;
    right:24px;
    top:24px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    z-index:6;
    pointer-events:none;
  }
  .chip{
    color:var(--gold);
    background:rgba(8,6,18,.7);
    border:2px solid var(--gold);
    border-radius:8px;
    padding:3px 9px;
    font-size:13px;
    letter-spacing:1px;
    font-weight:700;
    box-shadow:0 3px 0 #000;
  }
  .overlay{
    position:absolute;
    inset:14px;
    border-radius:10px;
    z-index:7;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-align:center;
    background:rgba(6,4,14,.6);
    pointer-events:none;
  }
  .hidden{ display:none; }
  .t-title{ font-size:18px; letter-spacing:6px; color:var(--cream); opacity:.9; }
  .t-main{
    font-size:46px;
    font-weight:900;
    letter-spacing:2px;
    line-height:1;
    color:var(--gold);
    text-shadow:0 4px 0 #7a1d13, 0 6px 0 #000;
  }
  .t-main span{ color:var(--cyan); text-shadow:0 4px 0 #0a3a52, 0 6px 0 #000; }
  .t-sub{ font-size:15px; letter-spacing:4px; color:var(--cyan); }
  .t-hi{ font-size:14px; letter-spacing:2px; color:var(--cream); }
  .t-start{ font-size:18px; font-weight:700; letter-spacing:3px; color:#fff; }
  .go-main{
    font-size:40px;
    font-weight:900;
    letter-spacing:3px;
    color:#ff3b30;
    text-shadow:0 4px 0 #7a1d13, 0 6px 0 #000;
  }
  .go-new{ font-size:15px; letter-spacing:2px; color:var(--gold); font-weight:700; }
  .go-line{ font-size:17px; letter-spacing:2px; color:var(--cream); }
  .go-again{ font-size:16px; font-weight:700; letter-spacing:3px; color:#fff; }
  .blink{ animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .char-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .char-btn{
    pointer-events:auto;
    font-family:inherit;
    font-size:20px;
    font-weight:900;
    letter-spacing:2px;
    color:var(--cream);
    background:var(--panel);
    border:3px solid var(--gold);
    border-radius:14px;
    padding:18px 24px;
    cursor:pointer;
    box-shadow:0 4px 0 #000;
    text-shadow:0 2px 0 #000;
  }
  .char-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #000; }
  .char-btn.sel{ background:var(--gold); color:#3a1d0a; text-shadow:none; }
  .char-btn:not(.sel):hover{ border-color:var(--cyan); }
</style>
</head>
<body>

  <header id="top">
    <a id="back-btn" href="index.html" aria-label="Volver">←</a>
    <div id="brand">DONATELLO'S // ZONA ARCADE</div>
    <button id="sound-btn" aria-label="Sonido">🔊</button>
  </header>

  <main id="cabinet">
    <div id="screen">
      <canvas id="game" width="360" height="640"></canvas>
      <div id="crt"></div>
      <div id="hud">
        <div class="chip">SCORE <span id="hud-score">000000</span></div>
        <div class="chip">HI <span id="hud-best">000000</span></div>
      </div>
      <div id="title" class="overlay">
        <div class="t-title">DONATELLO'S PRESENTS</div>
        <div class="t-main">DELIVERY<br><span>DASH</span></div>
        <div class="t-sub">16-BIT EDITION</div>
        <div class="t-hi">HI-SCORE <span id="title-best">000000</span></div>
        <div class="t-start blink" id="start-hint">TAP TO START</div>
      </div>
      <div id="gameover" class="overlay hidden">
        <div class="go-main">GAME OVER</div>
        <div id="go-new" class="go-new hidden">★ NEW HIGH SCORE! ★</div>
        <div class="go-line">SCORE <span id="go-score">0</span></div>
        <div class="go-line">BEST <span id="go-best">0</span></div>
        <div class="go-again blink" id="again-hint">TAP TO REINSERT COIN</div>
      </div>
      <div id="charsel" class="overlay hidden">
        <div class="t-title">ELIGE TU PILOTO</div>
        <div class="char-row">
          <button class="char-btn" id="btn-nino" aria-label="Elegir piloto niño">NIÑO</button>
          <button class="char-btn" id="btn-nina" aria-label="Elegir piloto niña">NIÑA</button>
        </div>
        <div class="t-hi">HI-SCORE <span id="select-best">000000</span></div>
        <div class="t-start blink">TAP TO SELECT</div>
      </div>
    </div>
  </main>

<script>
(() => {
  'use strict';

  const W = 360, H = 640, GROUND = 560;
  const TAU = Math.PI * 2;
  const GRAV = 2300, JUMPV = 1150;
  const SPEED_BASE = 165, SPEED_MAX = 440, SPEED_TAU = 32;
  const WHEELIE_ON = 210, WHEELIE_TILT = 0.9;
  const PKEY = 'donatellos_delivery_dash_best';
  const MKEY = 'donatellos_delivery_dash_muted';

  const $ = (id) => document.getElementById(id);
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const cabinet = $('cabinet');
  function fit() {
    const availW = cabinet.clientWidth, availH = cabinet.clientHeight;
    const s = Math.max(0.05, Math.min((availW - 48) / W, (availH - 48) / H));
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();

  const CPAL = { B:'#2a1710', T:'#c97f47', F:'#a9653a', S:'#83491f', D:'#5e3018' };
  const CNPAL = { B:'#2a1208', O:'#ff7a1f', H:'#ffb14d', W:'#ffe9c9', S:'#1a0d07' };

  let WHEEL_R = 21;
  const WHEELS = [
    { cx: 27, cy: 224 },
    { cx: 190, cy: 224 }
  ];
  const WHEEL_OSC = [0, 2, 0, -2];

  let moto = null;
  let motoReady = false;
  let tick = 0;
  let playTime = 0;
  let motoImg = null;
  let selIdx = 0;

  function prepareSprite(src) {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    const cx = c.getContext('2d');
    cx.drawImage(src, 0, 0);
    const id = cx.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    let hasAlpha = false;
    for (let i = 3; i < d.length; i += 4) {
      if (d[i] < 250) { hasAlpha = true; break; }
    }
    if (!hasAlpha) {
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] < 35 && d[i+1] < 35 && d[i+2] < 35) d[i+3] = 0;
      }
      cx.putImageData(id, 0, 0);
    }
    const w = c.width, h = c.height;
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 40) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
    if (maxX < 0) return null;
    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    const out = document.createElement('canvas');
    out.width = bw; out.height = bh;
    out.getContext('2d').drawImage(c, minX, minY, bw, bh, 0, 0, bw, bh);
    return out;
  }

  function setMotoFromCanvas(cv) {
    const w = cv.width, h = cv.height;
    const s = Math.min(0.9, 100 / h);
    moto = {
      S: s, W: w * s, H: h * s,
      hb: { ox: 0.068 * w, oy: -0.752 * h, w: 0.853 * w, h: 0.752 * h }
    };
    WHEELS[0] = { cx: 0.101 * w, cy: 0.910 * h };
    WHEELS[1] = { cx: 0.714 * w, cy: 0.910 * h };
    WHEEL_R = Math.max(10, Math.round(0.079 * w));
    player.x = 30;
    motoReady = true;
  }

  function pick(kind) {
    const file = kind === 'nino' ? 'moto_juego_niño.png' : 'moto_juego_niña.png';
    const img = new Image();
    img.onload = function () {
      const cv = prepareSprite(img);
      if (cv) { motoImg = cv; setMotoFromCanvas(cv); }
      startGame();
    };
    img.onerror = function () { startGame(); };
    img.src = encodeURIComponent(file).replace(/%2F/g, '/');
  }

  const CRATE = [
    "..BBBBBBBBBBBB..",
    ".BTTTTTTTTTTTTB.",
    ".BTFFFFFFSSFFFB.",
    ".BTFFFFFFFFFFFB.",
    ".BTFFFFFFSSFFFB.",
    ".BTFFFFFDDFFFFFB.",
    ".BTFDFFFFFFFFFFB.",
    ".BTFFDFFFFFFDFFB.",
    ".BTFFFDFFFFFDFFB.",
    ".BTFFFFFDDFFFFFB.",
    ".BTFFSSFFFFFFFB.",
    ".BTFFFFFFFFFFFFB.",
    ".BTFFFFFFFFFFFFB.",
    "..BBBBBBBBBBBB.."
  ];

  const CONE = [
    ".....BB.....",
    "....BOOOBB..",
    "....BOOOOB..",
    "...BOOOOOOB.",
    "...BOOOOOOB.",
    "..BOOOOOOOOB",
    "..BOHOOOOOOB",
    ".BOOOOOOOOOB",
    ".BOOOOOOOOOB",
    ".BOOOOOOOOOB",
    ".BWWWWWWWWB.",
    "..BBBBBBBB..",
    "...SSSSSS..."
  ];

  function drawSprite(grid, pal, x, y, u) {
    for (let r = 0; r < grid.length; r++) {
      const row = grid[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        const col = pal[ch];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(x + c * u, y + r * u, u, u);
      }
    }
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  function hash(i) {
    const s = Math.sin(i * 127.1 + 311.7) * 43758.5453123;
    return s - Math.floor(s);
  }

  let roadPat = null;
  function buildRoadTile() {
    const t = document.createElement('canvas');
    t.width = 8; t.height = 8;
    const c = t.getContext('2d');
    c.fillStyle = '#26292f'; c.fillRect(0, 0, 8, 8);
    c.fillStyle = '#1f2126';
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      if ((x * 7 + y * 13) % 5 === 0) c.fillRect(x, y, 1, 1);
    }
    c.fillStyle = '#2f333b';
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      if ((x * 3 + y * 5) % 7 === 0) c.fillRect(x, y, 1, 1);
    }
    return t;
  }

  let state = 'title';
  let score = 0;
  let best = parseInt(localStorage.getItem(PKEY) || '0', 10) || 0;
  let muted = localStorage.getItem(MKEY) === '1';
  let speed = 0;
  let time = 0;
  let shakeT = 0;
  let flashT = 0;
  const shakeMag = 10;
  let camFar = 0, camMid = 0, camRoad = 0;
  let obstacles = [], pepis = [], parts = [], floats = [];
  let obstacleT = 1.1, pepT = 0.9;
  const player = { x: 30, y: GROUND, vy: 0, onGround: true };

  function drawSun() {
    const sx = 262, sy = 148, sr = 30;
    ctx.fillStyle = 'rgba(255,170,60,0.35)';
    circle(sx, sy, sr + 12);
    ctx.fillStyle = '#ffbe3d';
    circle(sx, sy, sr);
    ctx.fillStyle = '#ff7b33';
    for (let y = sy - 6; y < sy + sr - 4; y += 3) {
      for (let x = sx - sr + 4; x < sx + sr - 4; x += 3) {
        if ((x + y) % 6 === 0) {
          const dx = x - sx, dy = y - sy;
          if (dx * dx + dy * dy > sr * sr * 0.55) ctx.fillRect(x, y, 3, 3);
        }
      }
    }
  }

  function drawSkyline(off) {
    const spacing = 96, margin = 30;
    const first = Math.floor((off - margin) / spacing);
    const count = Math.ceil((off + W + margin) / spacing) + 1;
    for (let i = first; i < first + count; i++) {
      const x = i * spacing - off;
      const h = 46 + hash(i) * 130;
      const bw = spacing - 16;
      ctx.fillStyle = '#241f4a';
      ctx.fillRect(x, GROUND - 6 - h, bw, h);
      ctx.fillStyle = '#12103a';
      ctx.fillRect(x + 2, GROUND - 6 - h + 2, bw - 4, 4);
      if (hash(i + 77) > 0.5) {
        ctx.fillStyle = '#2b2a5a';
        ctx.fillRect(x + bw / 2, GROUND - 6 - h - 8, 2, 8);
        ctx.fillStyle = '#ff3b30';
        ctx.fillRect(x + bw / 2 - 2, GROUND - 6 - h - 10, 6, 2);
      }
      ctx.fillStyle = '#ffd23f';
      const cols = Math.max(2, Math.floor((bw - 8) / 7));
      for (let wx = 0; wx < cols; wx++) {
        for (let wy = 0; wy < Math.floor((h - 10) / 9); wy++) {
          if (hash(i * 31 + wx * 7 + wy * 13) > 0.6) {
            ctx.fillRect(x + 5 + wx * 7, GROUND - 6 - h + 8 + wy * 9, 3, 4);
          }
        }
      }
    }
  }

  function drawStorefronts(off) {
    const spacing = 150, margin = 30;
    const first = Math.floor((off - margin) / spacing);
    const count = Math.ceil((off + W + margin) / spacing) + 1;
    for (let i = first; i < first + count; i++) {
      const x = i * spacing - off;
      const h = 84 + hash(i + 9) * 56;
      const bw = spacing - 26;
      ctx.fillStyle = '#3a2c52';
      ctx.fillRect(x, GROUND - 6 - h, bw, h);
      const stripes = Math.floor(bw / 10);
      for (let k = 0; k < stripes; k++) {
        ctx.fillStyle = (k % 2) ? '#d63a2f' : '#f7e7c9';
        ctx.fillRect(x + 4 + k * 10, GROUND - 6 - h + 8, 10, 12);
      }
      ctx.fillStyle = '#ffd23f';
      const wins = Math.floor((bw - 16) / 9);
      for (let wx = 0; wx < wins; wx++) {
        if (hash(i * 53 + wx * 11) > 0.5) ctx.fillRect(x + 8 + wx * 9, GROUND - 6 - h + 34, 6, 9);
      }
      ctx.fillStyle = '#241f4a';
      ctx.fillRect(x + bw / 2 - 7, GROUND - 6 - 34, 14, 34);
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(x + bw / 2 - 4, GROUND - 6 - 22, 3, 6);
    }
  }

  function drawRoad(off) {
    ctx.fillStyle = '#262a30';
    ctx.fillRect(-30, GROUND, W + 60, H - GROUND);
    if (!roadPat) roadPat = ctx.createPattern(buildRoadTile(), 'repeat');
    ctx.fillStyle = roadPat;
    ctx.fillRect(-30, GROUND, W + 60, H - GROUND);
    ctx.fillStyle = '#1a1d22';
    ctx.fillRect(-30, GROUND + 8, W + 60, 3);
    ctx.fillStyle = '#7a7f88';
    ctx.fillRect(-30, GROUND - 6, W + 60, 6);
    ctx.fillStyle = '#c7ccd5';
    ctx.fillRect(-30, GROUND - 6, W + 60, 2);
    ctx.fillStyle = '#f4e3c1';
    const period = 60;
    const first = Math.floor((off - 30) / period);
    const count = Math.ceil((off + W + 30) / period) + 1;
    for (let i = first; i < first + count; i++) {
      const x = i * period - off;
      ctx.fillRect(x, GROUND + 26, 28, 4);
    }
  }

  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#1a0f3c');
    g.addColorStop(0.45, '#4a1560');
    g.addColorStop(0.7, '#c2453a');
    g.addColorStop(1, '#ff9a4a');
    ctx.fillStyle = g;
    ctx.fillRect(-24, -24, W + 48, H + 48);
    ctx.fillStyle = '#e0633f';
    for (let y = GROUND - 40; y < GROUND - 6; y += 4) {
      for (let x = 0; x < W; x += 8) {
        if (((x / 8) + (y / 4)) % 2 === 0) ctx.fillRect(x, y, 4, 4);
      }
    }
    drawSun();
    drawSkyline(camFar);
    drawStorefronts(camMid);
    drawRoad(camRoad);
  }

  function playerBox() {
    if (!moto) return { x: player.x, y: GROUND - 100, w: 90, h: 100 };
    const s = moto.S;
    return { x: player.x + moto.hb.ox * s, y: player.y + moto.hb.oy * s, w: moto.hb.w * s, h: moto.hb.h * s };
  }

  function drawPlayer() {
    if (!motoReady || !moto) return;
    const s = moto.S;
    const iw = motoImg.width, ih = motoImg.height;
    const gy = player.y - moto.H;
    const osc = (state === 'play' && player.onGround) ? WHEEL_OSC[tick % 4] : 0;
    const tilt = Math.max(0, Math.min(1, (speed - WHEELIE_ON) / (SPEED_MAX - WHEELIE_ON))) * WHEELIE_TILT;
    ctx.save();
    ctx.translate(player.x + moto.W, gy);
    ctx.scale(-1, 1);
    if (tilt > 0) {
      const rw = WHEELS[0];
      ctx.translate(-rw.cx * s, rw.cy * s);
      ctx.rotate(tilt);
      ctx.translate(rw.cx * s, -rw.cy * s);
    }
    ctx.drawImage(motoImg, 0, 0, iw, ih, 0, 0, moto.W, moto.H);
    for (let k = 0; k < WHEELS.length; k++) {
      const w = WHEELS[k];
      const bx = (w.cx - WHEEL_R) * s, by = (w.cy - WHEEL_R) * s;
      const bw = WHEEL_R * 2 * s, bh = WHEEL_R * 2 * s;
      ctx.save();
      ctx.beginPath();
      ctx.rect(bx, by, bw, bh);
      ctx.clip();
      const pad = 4 * s;
      ctx.drawImage(
        motoImg,
        w.cx - WHEEL_R - 4, w.cy - WHEEL_R - 4, WHEEL_R * 2 + 8, WHEEL_R * 2 + 8,
        bx - pad, by - pad + osc * s, bw + pad * 2, bh + pad * 2
      );
      ctx.restore();
    }
    ctx.restore();
  }

  function drawPepi(p) {
    const x = p.x;
    const y = p.y + Math.sin(time * 5 + p.phase) * 2;
    ctx.fillStyle = '#6e1610';
    circle(x, y, 11);
    ctx.fillStyle = '#c23b1e';
    circle(x, y, 9);
    ctx.fillStyle = '#e25c2c';
    circle(x, y, 6);
    for (let a = 0; a < 16; a++) {
      const ang = a / 16 * TAU;
      const rx = Math.round(x + Math.cos(ang) * 7);
      const ry = Math.round(y + Math.sin(ang) * 7);
      ctx.fillStyle = (a % 2) ? '#c23b1e' : '#8f2413';
      ctx.fillRect(rx, ry, 2, 2);
    }
    ctx.fillStyle = '#a5281a';
    ctx.fillRect(Math.round(x - 2), Math.round(y + 1), 2, 2);
    ctx.fillRect(Math.round(x + 1), Math.round(y - 2), 2, 2);
    ctx.fillRect(Math.round(x + 3), Math.round(y + 3), 2, 2);
    ctx.fillStyle = '#fff3dc';
    ctx.fillRect(Math.round(x - 5), Math.round(y - 6), 2, 2);
    ctx.fillRect(Math.round(x - 2), Math.round(y - 8), 2, 2);
    ctx.fillRect(Math.round(x + 1), Math.round(y - 7), 2, 2);
    ctx.fillRect(Math.round(x - 7), Math.round(y - 2), 2, 1);
  }

  function drawObstacle(o) {
    if (o.type === 'crate2') {
      drawSprite(CRATE, CPAL, o.x, GROUND - 56, 2);
      drawSprite(CRATE, CPAL, o.x, GROUND - 28, 2);
    } else if (o.type === 'crate') {
      drawSprite(CRATE, CPAL, o.x, GROUND - 28, 2);
    } else {
      drawSprite(CONE, CNPAL, o.x, GROUND - 26, 2);
    }
  }

  function drawFx() {
    for (const p of parts) {
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'center';
    for (const f of floats) {
      ctx.fillStyle = 'rgba(255,210,63,' + Math.min(1, f.life / 0.4) + ')';
      ctx.fillText(f.txt, Math.round(f.x), Math.round(f.y));
    }
  }

  function draw() {
    ctx.save();
    if (shakeT > 0) {
      const k = Math.max(0, shakeT) / 0.15;
      ctx.translate((Math.random() * 2 - 1) * shakeMag * k, (Math.random() * 2 - 1) * shakeMag * k);
    }
    drawBg();
    for (const o of obstacles) drawObstacle(o);
    for (const p of pepis) drawPepi(p);
    if (state !== 'dead') drawPlayer();
    drawFx();
    if (flashT > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flashT / 0.12 * 0.85) + ')';
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }
    ctx.restore();
  }

  function overlap(o) {
    const p = playerBox();
    let b;
    if (o.type === 'crate') b = { x: o.x + 2, y: GROUND - 26, w: 28, h: 26 };
    else if (o.type === 'crate2') b = { x: o.x + 2, y: GROUND - 54, w: 28, h: 54 };
    else b = { x: o.x + 4, y: GROUND - 24, w: 18, h: 24 };
    return p.x < b.x + b.w && p.x + p.w > b.x && p.y < b.y + b.h && p.y + p.h > b.y;
  }

  function burst(x, y, n, cols) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const v = 60 + Math.random() * 160;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 80,
        life: 0.35 + Math.random() * 0.3,
        col: cols[Math.floor(Math.random() * cols.length)],
        size: 2 + (Math.random() < 0.3 ? 2 : 0)
      });
    }
  }

  function spawnObstacle() {
    const r = Math.random();
    let type = 'crate';
    if (r < 0.3) type = 'cone';
    else if (r < 0.44) type = 'crate2';
    else if (r < 0.62) type = 'cone';
    obstacles.push({ x: W + 40, type: type });
  }

  function spawnPepis() {
    const n = 1 + Math.floor(Math.random() * 3);
    const baseY = GROUND - 30 - Math.random() * 120;
    for (let i = 0; i < n; i++) {
      pepis.push({ x: W + 40 + i * 30, y: Math.max(60, baseY - i * 26), phase: Math.random() * TAU });
    }
  }

  function collectFx(p) {
    burst(p.x, p.y, 8, ['#ffd23f', '#fff3dc', '#ff9a4a']);
    floats.push({ x: p.x, y: p.y - 8, txt: '+10', life: 0.7 });
  }

  function updateFx(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += 900 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      floats[i].y -= 32 * dt;
      floats[i].life -= dt;
      if (floats[i].life <= 0) floats.splice(i, 1);
    }
  }

  function crash() {
    state = 'dying';
    shakeT = 0.15;
    flashT = 0.12;
    burst(player.x + (moto ? moto.W * 0.5 : 50), player.y - (moto ? moto.H * 0.5 : 30), 28, ['#ffd23f', '#ff8c42', '#ff3b30', '#ffffff', '#14c8ff']);
    sfxCrash();
  }

  function update(dt) {
    playTime += dt;
    speed = SPEED_MAX - (SPEED_MAX - SPEED_BASE) * Math.exp(-playTime / SPEED_TAU);
    camFar += speed * 0.12 * dt;
    camMid += speed * 0.30 * dt;
    camRoad += speed * dt;

    obstacleT -= dt;
    if (obstacleT <= 0) {
      spawnObstacle();
      obstacleT = Math.max(0.85, 2.6 - speed * 0.003) * (0.85 + Math.random() * 0.3);
    }
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed * dt;
      if (o.x < -60) obstacles.splice(i, 1);
      else if (overlap(o)) { crash(); return; }
    }

    pepT -= dt;
    if (pepT <= 0) {
      spawnPepis();
      pepT = 0.55 + Math.random() * 0.95;
    }
    const cx = player.x + (moto ? moto.W * 0.5 : 60), cy = player.y - (moto ? moto.H * 0.55 : 30);
    const pr = (moto ? 46 * moto.S : 46) + 22;
    for (let i = pepis.length - 1; i >= 0; i--) {
      const p = pepis[i];
      p.x -= speed * dt;
      if (p.x < -24) pepis.splice(i, 1);
      else {
        const dx = p.x - cx, dy = p.y - cy;
        if (dx * dx + dy * dy < pr * pr) {
          score += 10;
          collectFx(p);
          sfxPep();
          pepis.splice(i, 1);
        }
      }
    }

    if (!player.onGround) {
      player.vy += GRAV * dt;
      player.y += player.vy * dt;
      if (player.y >= GROUND) {
        player.y = GROUND;
        player.vy = 0;
        player.onGround = true;
      }
    } else {
      tick++;
    }

    updateFx(dt);
    updateHud();
  }

  function updateHud() {
    $('hud-score').textContent = String(score).padStart(6, '0');
    $('hud-best').textContent = String(best).padStart(6, '0');
  }

  function startGame() {
    state = 'play';
    score = 0;
    playTime = 0;
    speed = SPEED_BASE;
    obstacles = [];
    pepis = [];
    parts = [];
    floats = [];
    player.x = 30;
    player.y = GROUND;
    player.vy = 0;
    player.onGround = true;
    tick = 0;
    obstacleT = 1.0;
    pepT = 0.6;
    shakeT = 0;
    flashT = 0;
    $('title').classList.add('hidden');
    $('gameover').classList.add('hidden');
    $('charsel').classList.add('hidden');
    updateHud();
  }

  function showCharSel() {
    state = 'select';
    $('title').classList.add('hidden');
    $('gameover').classList.add('hidden');
    $('select-best').textContent = String(best).padStart(6, '0');
    $('charsel').classList.remove('hidden');
    highlightSel();
  }

  function highlightSel() {
    $('btn-nino').classList.toggle('sel', selIdx === 0);
    $('btn-nina').classList.toggle('sel', selIdx === 1);
  }

  function showGameOver() {
    const isNew = score > best;
    if (isNew) {
      best = score;
      localStorage.setItem(PKEY, String(best));
    }
    $('go-score').textContent = String(score);
    $('go-best').textContent = String(best);
    $('title-best').textContent = String(best).padStart(6, '0');
    $('go-new').style.display = isNew ? 'block' : 'none';
    $('gameover').classList.remove('hidden');
    updateHud();
  }

  let AC = null;
  function audio() {
    if (muted) return null;
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(f0, f1, dur, type, vol) {
    const ac = audio();
    if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur + 0.02);
  }
  function sfxJump() { tone(180, 520, 0.12, 'square', 0.18); }
  function sfxPep() { tone(880, 1320, 0.09, 'square', 0.16); }
  function sfxCrash() {
    tone(220, 40, 0.4, 'sawtooth', 0.3);
    tone(90, 30, 0.5, 'square', 0.2);
  }

  function jump() {
    if (player.onGround) {
      player.vy = -JUMPV;
      player.onGround = false;
      sfxJump();
    }
  }

  function onPress(e) {
    e.preventDefault();
    audio();
    if (state === 'play') jump();
    else if (state === 'title' || state === 'dead') showCharSel();
    else if (state === 'select') pick(selIdx === 0 ? 'nino' : 'nina');
  }

  const isTouch = (('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches));
  const screenEl = $('screen');
  screenEl.addEventListener(window.PointerEvent ? 'pointerdown' : 'touchstart', (e) => {
    if (window.PointerEvent && e.pointerType !== 'touch') return;
    onPress(e);
  }, { passive: false });
  screenEl.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault();
      onPress(e);
    } else if (state === 'select' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
      e.preventDefault();
      selIdx = 1 - selIdx;
      highlightSel();
    }
  });

  const btnNino = $('btn-nino'), btnNina = $('btn-nina');
  function bindBtn(btn, kind) {
    btn.addEventListener('pointerdown', (e) => e.stopPropagation());
    btn.addEventListener('touchstart', (e) => e.stopPropagation());
    btn.addEventListener('click', () => {
      selIdx = kind === 'nino' ? 0 : 1;
      highlightSel();
      pick(kind);
    });
  }
  bindBtn(btnNino, 'nino');
  bindBtn(btnNina, 'nina');

  if (!isTouch) {
    $('start-hint').textContent = 'PRESS SPACE';
    $('again-hint').textContent = 'PRESS SPACE';
    $('charsel').querySelector('.t-start').textContent = 'SPACE / ← →';
  }

  const soundBtn = $('sound-btn');
  function setMuted(m) {
    muted = m;
    localStorage.setItem(MKEY, m ? '1' : '0');
    soundBtn.textContent = m ? '🔇' : '🔊';
  }
  soundBtn.addEventListener('click', () => setMuted(!muted));
  setMuted(muted);

  $('title-best').textContent = String(best).padStart(6, '0');
  updateHud();

  let last = performance.now();
  let fitted = false;
  function frame(now) {
    if (!fitted) { fit(); fitted = true; }
    const dt = Math.min(0.033, (now - last) / 1000) || 0.016;
    last = now;
    time += dt;

    try {
      if (state === 'play') {
        update(dt);
      } else if (state === 'dying') {
        shakeT -= dt;
        if (flashT > 0) flashT -= dt;
        updateFx(dt);
        if (shakeT <= 0) {
          state = 'dead';
          showGameOver();
        }
      } else if (state === 'dead') {
        if (flashT > 0) flashT -= dt;
        updateFx(dt);
      } else {
        camFar += 14 * dt;
        camMid += 26 * dt;
        camRoad += 34 * dt;
        updateFx(dt);
      }
    } catch (err) {
      console.error(err);
    }

    try {
      draw();
    } catch (err) {
      console.error(err);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
